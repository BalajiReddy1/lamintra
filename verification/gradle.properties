# Kotlin/Native compilation of the Compose runtime for iOS is far heavier than
# the JVM build. Without these the Gradle daemon on a macOS CI runner dies with
# "the JVM garbage collector is thrashing" before any test runs — which reads
# like an iOS failure but is only an out-of-memory one.
#
# macos-latest runners have ~7 GB, so this leaves headroom rather than
# claiming all of it: the Gradle and Kotlin daemons do not peak together.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2g

kotlin.code.style=official
