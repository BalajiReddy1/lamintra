name: Bug report
description: Something did not work. Include enough that someone else can reproduce it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not go here - see [SECURITY.md](https://github.com/BalajiReddy1/lamintra/blob/master/SECURITY.md).
  - type: textarea
    id: ran
    attributes:
      label: What I ran
      description: The exact command, and the directory you ran it in.
      placeholder: |
        cd C:\dev\my-app
        java -jar lamintra-0.9.0.jar add sheet
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What I expected
    validations: { required: true }
  - type: textarea
    id: got
    attributes:
      label: What I got
      description: Paste the output verbatim, including any error, rather than describing it.
      render: text
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of `java -version` and `./gradlew --version`, plus your Kotlin, AGP and Compose versions."
      render: text
    validations: { required: true }
  - type: input
    id: cli
    attributes:
      label: CLI version
      description: The jar filename, e.g. lamintra-0.9.0.jar. Only the latest release is supported.
    validations: { required: true }
  - type: dropdown
    id: shape
    attributes:
      label: Project type
      options:
        - Kotlin Multiplatform
        - Android only
        - Multi-module
        - Other / not sure
    validations: { required: true }
